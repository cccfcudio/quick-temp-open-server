name: Android APK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Assemble debug APK (builds cloudflared if needed)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify cloudflared is packaged
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcloudflared.so'

      - name: Stage APK artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: quick-temp-open-server-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
